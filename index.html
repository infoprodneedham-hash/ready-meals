<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Meal Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Smart Meal Planner</h1>
        <div class="people-selector">
            <label for="people-count">Cooking for:</label>
            <select id="people-count" onchange="updateServings()">
                <option value="1">1 Person</option>
                <option value="2" selected>2 People</option>
                <option value="3">3 People</option>
                <option value="4">4 People</option>
            </select>
        </div>
    </header>

    <main>
        <section id="menu-categories"></section>

        <hr class="divider">

        <section id="shopping-list">
            <h2>Your Shopping List</h2>
            <p class="list-hint">Tap a recipe above to add ingredients. Tap a list item to remove it.</p>
            <ul id="list-items">
                </ul>
            
            <button class="clear-btn" onclick="clearList()">Clear Everything</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
