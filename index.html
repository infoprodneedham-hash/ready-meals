<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Feast Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meal Planner</h1>
    </header>

    <main id="app">
        <section id="menu-categories"></section>

        <hr>

        <section id="shopping-list">
            <h2>Your Shopping List</h2>
            <ul id="list-items">
                <p>Select recipes to see ingredients!</p>
            </ul>
            <button onclick="clearList()" class="clear-btn">Clear List</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
